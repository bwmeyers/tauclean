[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tauclean"
description = "A pulsar profile deconvolution method for the recovery of intrisic profile shapes and ISM broadening functions."
dynamic = ["version"]
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
    { name = "Bradley Meyers", email = "bradley.meyers1993@gmail.com" },
    { name = "Ramesh Bhat", email = "rameshbhatnd@gmail.com" },
    { name = "Olivia Young", email = "olivia.young@nanograv.org" },
    { name = "Michael Lam", email = "michael.lam@nanograv.org" },
]
maintainers = [
    { name = "Bradley Meyers", email = "bradley.meyers1993@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Academic Free License (AFL)",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.16.0",
    "matplotlib>=3.0.0",
    "scipy>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=5.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "sphinx-autodoc-typehints>=1.25",
]

[project.scripts]
tauclean = "tauclean.scripts.cli_tauclean:main"
simulate = "tauclean.scripts.cli_simulate:main"

[project.urls]
Repository = "https://github.com/bwmeyers/tauclean.git"
Issues = "https://github.com/bwmeyers/tauclean/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = "^(?:[vV])?(?P<version>.+)$"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.hatch.build.hooks.vcs]
version-file = "tauclean/_version.py"

[tool.ruff]
line-length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=tauclean",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["tauclean"]
omit = ["tauclean/_version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
